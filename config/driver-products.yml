vegetation_decision:
  reviewed_on: "2026-11-02"
  scope: Updated spatial dataset
  retained_product: gpp
  ndvi_status: discontinued
  replacement_greenup_status: discontinued
  included_modis_products:
    - npp
    - greenup_day
  notes: Keep BESS GPP, MODIS NPP, and both MODIS greenup cycles with their coverage fields

products:
  precip:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: total_precipitation_sum
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: m
    output_units: mm
    scale_factor: 1000
    offset: 0
    daily_to_monthly: sum
    daily_to_annual: sum
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: precip_mm
    notes: Higher spatial and temporal resolution replacement for GPCP monthly precipitation; use complete annual exports through 2025

  temp:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: temperature_2m
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: K
    output_units: degC
    scale_factor: 1
    offset: -273.15
    daily_to_monthly: mean
    daily_to_annual: mean
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: temp_degC
    notes: Daily 2 m air temperature summarized to monthly and annual watershed means

  evapotrans:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: total_evaporation_sum
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: m
    output_units: mm
    scale_factor: -1000
    offset: 0
    daily_to_monthly: sum
    daily_to_annual: sum
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: evapotrans_mm
    notes: ERA5-Land evaporation is negative for upward water flux, so the scale factor flips sign and converts m to mm

  potential_evap:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: potential_evaporation_sum
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: m
    output_units: mm
    scale_factor: -1000
    offset: 0
    daily_to_monthly: sum
    daily_to_annual: sum
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: potential_evap_mm
    notes: Potential evaporation is included as an atmospheric demand variable; scale factor follows ERA5-Land evaporation sign convention and converts m to mm

  snow_cover:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: snow_cover
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: percent
    output_units: fraction
    scale_factor: 0.01
    offset: 0
    daily_to_monthly: mean
    daily_to_annual: max
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: snow_cover_fraction
    notes: Annual analysis uses the ERA5-Land annual maximum snow-cover image summarized as a watershed mean. Pilot exports came through on a 0-100 scale, so divide by 100 and keep outputs as fractions

  snow_water_equiv:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: snow_depth_water_equivalent
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: m
    output_units: mm
    scale_factor: 1000
    offset: 0
    daily_to_monthly: mean
    daily_to_annual: max
    output_temporal_resolution:
      - daily
      - monthly
      - annual
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: snow_water_equiv_mm
    notes: Snow depth water equivalent converted from m to mm; annual summaries use peak watershed mean snow water equivalent

  temp_min:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: temperature_2m_min
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: K
    output_units: degC
    scale_factor: 1
    offset: -273.15
    daily_to_monthly: min
    daily_to_annual: min
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: temp_min_degC
    notes: Daily minimum 2 m air temperature averaged over each watershed

  temp_max:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: temperature_2m_max
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: K
    output_units: degC
    scale_factor: 1
    offset: -273.15
    daily_to_monthly: max
    daily_to_annual: max
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: temp_max_degC
    notes: Daily maximum 2 m air temperature averaged over each watershed

  runoff:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: runoff_sum
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: m
    output_units: mm
    scale_factor: 1000
    offset: 0
    daily_to_monthly: sum
    daily_to_annual: sum
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: runoff_mm
    notes: Daily total runoff converted to watershed-average water depth

  solar_energy:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: surface_solar_radiation_downwards_sum
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: J_m2
    output_units: MJ_m2
    scale_factor: 0.000001
    offset: 0
    daily_to_monthly: sum
    daily_to_annual: sum
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: solar_energy_mj_m2
    notes: Daily incoming solar energy converted from joules to megajoules per square meter

  soil_water_layer_1:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: volumetric_soil_water_layer_1
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: volume_fraction
    output_units: fraction
    scale_factor: 1
    offset: 0
    daily_to_monthly: mean
    daily_to_annual: mean
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: soil_water_layer_1_fraction
    notes: Daily mean volumetric soil water for the 0 to 7 cm layer

  soil_water_layer_3:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: volumetric_soil_water_layer_3
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: volume_fraction
    output_units: fraction
    scale_factor: 1
    offset: 0
    daily_to_monthly: mean
    daily_to_annual: mean
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: soil_water_layer_3_fraction
    notes: Daily mean volumetric soil water for the 28 to 100 cm layer

  vapor_pressure:
    status: selected
    source: ECMWF ERA5-Land daily aggregated
    gee_id: ECMWF/ERA5_LAND/DAILY_AGGR
    band: dewpoint_temperature_2m
    product_group: era5_land
    type: continuous
    source_temporal_resolution: daily
    selected_spatial_resolution_m: 11100
    native_units: K
    output_units: Pa
    scale_factor: 1
    offset: -273.15
    daily_to_monthly: mean
    daily_to_annual: mean
    output_temporal_resolution:
      - daily
    available_start_date: 1950-01-02
    available_end_date_checked: 2026-06-22
    export_start_year: 2000
    export_end_year: 2025
    reducer: mean
    output_name: vapor_pressure_pa
    notes: Derived from daily mean dew point with the same equation used by the monthly model

  gpp:
    status: selected_external
    source: BESSv2 monthly mean GPP
    source_url: https://www.environment.snu.ac.kr/bessv2
    access: local_netcdf
    type: continuous
    source_temporal_resolution: monthly
    selected_spatial_resolution_degrees: 0.05
    output_temporal_resolution:
      - annual
    export_start_year: 1982
    export_end_year: 2022
    native_units: gC_m2_day_scaled
    output_units: gC_m2_year
    scale_factor: 0.01
    fill_value: -9999
    monthly_to_annual: calendar_day_weighted_sum
    reducer: watershed_overlap_weighted_mean
    available_start_date: 1982-01-01
    available_end_date_checked: 2022-12-31
    output_name: bess_gpp_gC_m2_year
    notes: Multiply the mean daily GPP by the days in each month before summing. Require all twelve months over the same cells and at least 80 percent watershed coverage. Keep original values and trend flags

  npp:
    status: selected_saved
    source: MODIS annual NPP
    gee_id: MODIS/061/MOD17A3HGF
    band: Npp
    type: continuous
    source_temporal_resolution: annual
    selected_spatial_resolution_m: 500
    native_units: kgC_m2_year_scaled
    output_units: kgC_m2_year
    output_temporal_resolution:
      - annual
    available_start_date: 2001-01-01
    available_end_date_checked: 2025-01-01
    export_start_year: 2001
    export_end_year: 2025
    scale_factor: 0.0001
    offset: 0
    reducer: mean
    output_name: npp_kgC_m2_year
    notes: Use verified AppEEARS NPP results in the Updated dataset

  greenup_day:
    status: selected_saved
    source: MODIS land cover dynamics
    gee_id: MODIS/061/MCD12Q2
    band: Greenup_1
    type: phenology
    source_temporal_resolution: annual
    selected_spatial_resolution_m: 500
    output_units: day_of_year
    output_temporal_resolution:
      - annual
    available_start_date: 2001-01-01
    available_end_date_checked: 2024-01-01
    export_start_year: 2001
    export_end_year: 2024
    reducer: mean
    output_name: greenup_day
    notes: Keep both AppEEARS greenup cycles and their calendar dates. Use separate coverage fields where available

  land_cover:
    status: selected
    source: GLC_FCS30D annual land cover
    gee_id: projects/sat-io/open-datasets/GLC-FCS30D/annual
    type: class_fraction
    source_temporal_resolution: annual
    selected_spatial_resolution_m: 30
    output_units: percent
    output_temporal_resolution:
      - annual
    available_start_date: 1985-01-01
    available_end_date_checked: 2022-12-31
    export_start_year: 1985
    export_end_year: 2022
    reducer: class_fraction
    output_name: land_cover_percent
    notes: Selected LULC product is GLC_FCS30D annual land cover; use the 30 m annual classes for 1985-2022 listed in the GEE Community Catalog

  elevation:
    status: selected
    source: SRTM elevation
    gee_id: USGS/SRTMGL1_003
    band: elevation
    type: continuous
    source_temporal_resolution: static
    selected_spatial_resolution_m: 30
    native_units: m
    output_units: m
    output_temporal_resolution:
      - static
    scale_factor: 1
    offset: 0
    reducer: mean
    output_name: elevation_m
    notes: Static watershed mean elevation

  permafrost:
    status: selected_deferred
    source: ESA Climate Change Initiative Permafrost_cci v5.0
    gee_id: DEFERRED_LOCAL_OR_UPLOADED_ESA_PERMAFROST_CCI_V5_PFR
    band: PFR
    type: continuous
    source_temporal_resolution: annual
    selected_spatial_resolution_m: 1000
    native_units: percent
    output_units: percent
    output_temporal_resolution:
      - period_mean
    available_start_date: 1997-01-01
    available_end_date_checked: 2023-12-31
    export_start_year: 2000
    export_end_year: 2022
    scale_factor: 1
    offset: 0
    reducer: area_weighted_mean
    temporal_reducer: mean
    output_name: mean_permafrost_area_fraction_2000_2022
    northern_hemisphere_doi: https://doi.org/10.5285/d235665772ec4b558e9a89ac85595e71
    northern_hemisphere_2022_source: https://data.ceda.ac.uk/neodc/esacci/permafrost/data/permafrost_extent/L4/area4/pp/v05.0/northern_hemisphere/2022
    antarctic_doi: https://doi.org/10.5285/25447c253cbe435b937347756fe47146
    coverage_qa:
      northern_hemisphere: Roughly north of 30 degrees N; catalog boundary is about 25 degrees N
      antarctica: Use the separate Antarctic product
      uncovered_regions: Keep missing and flag explicitly; never assign zero to the Andes, New Zealand, East Africa, or other uncovered regions
    legacy_glass_cq:
      source: GlobPermafrost PERPROB
      period: 2000-2016
      measure: Modeled permafrost occurrence probability
      rule: Preserve the current GlASS/CQ workflow unchanged; never append, extend, or mix PFR values with PERPROB
    notes: Extract annual area-weighted watershed means for PFR, then average 2000-2022 into one predictor named mean permafrost area fraction, 2000-2022. PFR is permafrost area fraction, not occurrence probability. Do not substitute surface freeze/thaw data. Work remains paused until 2026-08-20.

  lithology:
    status: needs_review
    source: GLiM lithology
    gee_id: projects/sat-io/open-datasets/GLiM
    type: class_fraction
    source_temporal_resolution: static
    output_units: percent
    output_temporal_resolution:
      - static
    reducer: class_fraction
    output_name: lithology_percent
    notes: Confirm class scheme before extraction

  soil_class:
    status: optional
    source: OpenLandMap USDA soil taxonomy great groups
    gee_id: OpenLandMap/SOL/SOL_GRTGROUP_USDA-SOILTAX_C/v01
    band: grtgroup
    type: class_fraction
    source_temporal_resolution: static
    selected_spatial_resolution_m: 250
    output_units: percent
    output_temporal_resolution:
      - static
    reducer: class_fraction
    output_name: soil_class_percent
    notes: Keep optional because the old soil-order output has not been very useful

  human_impacts:
    status: configured
    source: LandScan, GHSL, Global Dam Watch, NPKGRIDS, and HydroWASTE
    gee_id: config/human-impact-products.yml
    type: watershed_summary
    source_temporal_resolution: mixed
    output_temporal_resolution:
      - annual
      - static
    output_name: human_impacts_candidates
    notes: See config/human-impact-products.yml and docs/human-impact-workflow.md
