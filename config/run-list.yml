site_groups:
  column: run_group
  default: batch_001
  start_with_groups: true
  suggested_sites_per_group: 25-50
  notes: Put very large watersheds in smaller groups before launching full exports

active_run: era5_land_annual_full_2000_2025
launch:
  start_at: 0
  max_tasks_per_session: 2
  notes: Launch a small chunk, check outputs, then increase once the run looks good

outputs:
  current_timing:
    - daily
    - monthly
    - monthly_by_year
    - annual
    - static
  later_timing:
    - weekly
  notes: Daily ERA5-Land is available for separate analyses. The annual run is the default

runs:
  era5_land_daily_spatial_stats_2000_2025:
    mode: era5_land
    products:
      - precip
      - temp
      - temp_min
      - temp_max
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
      - runoff
      - solar_energy
      - soil_water_layer_1
      - soil_water_layer_3
      - vapor_pressure
    spatial_statistics:
      - mean
      - median
      - min
      - max
      - sd
    timing: daily
    start_year: 2000
    end_year: 2025
    months: all
    run_groups: all
    launch_export: false
    notes: Keep one row per watershed and day with five within-watershed statistics per driver

  era5_land_annual_full_2000_2025:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: annual
    start_year: 2000
    end_year: 2025
    run_groups: all
    launch_export: true
    notes: Config-driven grouped fallback for the current full annual ERA5-Land pull; primary Colab runs one all-site export per year

  era5_land_annual_overlap_2001_2022:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: annual
    start_year: 2001
    end_year: 2022
    run_groups: all
    launch_export: false
    notes: Shared comparison window for ERA5-Land, MODIS, and GLC_FCS30D

  land_cover_annual_overlap_2001_2022:
    mode: single_product
    products:
      - land_cover
    timing: annual
    start_year: 2001
    end_year: 2022
    run_groups: all
    launch_export: false
    notes: GLC_FCS30D annual land-cover window; class-fraction export still needs its own extractor before launching

  era5_land_annual_pilot:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: annual
    start_year: 2020
    end_year: 2020
    run_groups:
      - batch_001
    launch_export: true

  era5_land_monthly_pilot:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: monthly
    start_year: 2020
    end_year: 2020
    months:
      - 1
    run_groups:
      - batch_001
    launch_export: false

  era5_land_monthly_year_pilot:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: monthly_by_year
    start_year: 2020
    end_year: 2020
    months: all
    run_groups:
      - batch_001
    launch_export: false
    notes: One export file with all 12 months for one site group; use this before launching the full monthly run

  era5_land_monthly_full:
    mode: era5_land
    products:
      - precip
      - temp
      - evapotrans
      - potential_evap
      - snow_cover
      - snow_water_equiv
    timing: monthly_by_year
    start_year: 2000
    end_year: 2025
    months: all
    run_groups: all
    launch_export: false
    notes: Monthly ERA5-Land, bundled by year so each task writes 12 months for one site group

  static_context_full:
    mode: single_product
    products:
      - elevation
    timing: static
    run_groups: all
    launch_export: false
    notes: Static continuous context layers; the GlASS/CQ PERPROB workflow remains unchanged and separate

  permafrost_cci_mean_2000_2022:
    mode: single_product
    products:
      - permafrost
    timing: annual
    start_year: 2000
    end_year: 2022
    run_groups: all
    launch_export: false
    notes: Deferred until the paused workflow resumes on 2026-08-20. Extract annual area-weighted watershed means of ESA Permafrost_cci v5.0 PFR and average them into one predictor, mean permafrost area fraction, 2000-2022. Keep uncovered regions missing and flagged; do not merge PFR with GlobPermafrost PERPROB.
